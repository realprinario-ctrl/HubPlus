name: Build HubPlus

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B package
      - name: Rename compiled jar
        run: cp target/hubplus-1.0.0.jar target/HubPlus-1.0.jar
      - name: Upload compiled release
        uses: actions/upload-artifact@v4
        with:
          name: HubPlus-1.0
          path: target/HubPlus-1.0.jar
