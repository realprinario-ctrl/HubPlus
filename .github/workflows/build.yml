name: Build HubPlus

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Verify Velocity descriptor
        run: |
          test -f target/hubplus-1.0.0.jar
          unzip -l target/hubplus-1.0.0.jar | grep -q 'velocity-plugin.json'
      - name: Prepare release JAR
        run: cp target/hubplus-1.0.0.jar target/HubPlus-1.0.jar
      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: HubPlus-1.0
          path: target/HubPlus-1.0.jar
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: HubPlus v1.0-${{ github.run_number }}
          generate_release_notes: true
          files: target/HubPlus-1.0.jar